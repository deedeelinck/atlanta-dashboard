  html,body{height:100%}
  body{margin:0;display:flex;align-items:center;justify-content:center;padding:24px;

    color:var(--ink3);margin:22px 0 7px}
  input{width:100%;font-family:inherit;font-size:14px;padding:11px 13px;color:var(--ink);
    background:#fff;border:1px solid #DDE2E8;border-radius:9px;outline:none}
  input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(15,42,68,.09)}
  button{width:100%;margin-top:12px;font-family:inherit;font-size:13px;font-weight:600;
    color:#fff;background:var(--navy);border:0;border-radius:9px;padding:12px;cursor:pointer}
  button:hover{background:#16395B}
  button[disabled]{opacity:.6;cursor:default}
  .msg{margin-top:12px;font-size:11.5px;line-height:1.45;min-height:16px}
  .msg.err{color:#B4342C}
  .msg.busy{color:#667085}
  .hint{margin-top:18px;padding-top:15px;border-top:1px solid #F0F2F5;

const $ = s => document.querySelector(s);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:b64(P.salt), iterations:P.iter, hash:"SHA-256" },
    base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(P.iv) }, key, b64(P.data));
  return new TextDecoder().decode(plain);
}

$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = $("#p").value;
  if(!pw) return;
  const m = $("#m"), go = $("#go");
  go.disabled = true; m.className = "msg busy"; m.textContent = "Decrypting…";
  // let the browser paint the busy state before the key derivation blocks
  await new Promise(r => setTimeout(r, 30));
  let html;
  try {
    html = await unlock(pw);
  } catch(err) {
    go.disabled = false; m.className = "msg err";
    // a missing SubtleCrypto is an environment problem, not a bad password
    m.innerHTML = hasCrypto()
      ? "That password is not right."
      : localHint;
    $("#p").select();
    return;
  }
  m.className = "msg busy"; m.textContent = "Loading…";
  document.open(); document.write(html); document.close();
});

function hasCrypto(){ return !!(window.crypto && window.crypto.subtle); }

const localHint = location.protocol === "file:"
  ? "This copy only opens over <b>https://</b> — browsers switch off the decryption API for files "
    + "opened straight from disk, so the password can never be checked here.<br><br>"
    + "To read it on this computer, open <b>8Fleet Atlanta Site Hub - Team View.html</b> in the same folder "
    + "(no password needed). This copy is the one to upload for sharing."
  : "This page needs a browser with the Web Crypto API, served over https://. "
    + "Try a current version of Chrome, Safari, Edge or Firefox.";

if(!hasCrypto()){
  // say so before the password is even typed, rather than after
  $("#p").disabled = true;
  $("#go").disabled = true;
  $("#go").textContent = "Unavailable here";
  $("#m").className = "msg err";
  $("#m").innerHTML = localHint;
}
})();
</script>
